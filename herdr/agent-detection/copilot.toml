# Local override of herdr's Copilot detection manifest (remote 2026.08.29.1).
# Copilot CLI's footer now reads "Working · … ctrl+c interrupt" (sometimes
# "esc esc interrupt") instead of "esc to cancel", so every Copilot pane
# showed idle: https://github.com/herdrdev/herdr/issues/5799. Local overrides
# shadow remote updates, so drop this file once upstream ships a fix.
id = "copilot"
version = "2026.11.10.1"
min_engine_version = 1
updated_at = "2026-11-10T00:00:00Z"
aliases = ["github-copilot", "ghcs"]

[[rules]]
id = "selection_blocker"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
all = [
  { any = [
    { contains = ["esc to cancel"] },
    { contains = ["esc cancel"] },
  ] },
  { any = [
    { contains = ["enter to select"] },
    { contains = ["enter to confirm"] },
    { contains = ["enter to submit"] },
    { contains = ["enter accept"] },
  ] },
]

[[rules]]
id = "background_agents_working"
state = "working"
priority = 110
region = "bottom_non_empty_lines(6)"
visible_working = true
line_regex = ['^\s*◎\s+Waiting for background agents(?:\s|·|$)']

[[rules]]
id = "working_footer"
state = "working"
priority = 105
region = "bottom_non_empty_lines(6)"
visible_working = true
any = [
  { contains = ["ctrl+c interrupt"] },
  { contains = ["esc esc interrupt"] },
]

[[rules]]
id = "working_cancel_hint"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
any = [
  { contains = ["esc to cancel"] },
  { contains = ["esc cancel"] },
  { contains = ["esc again to cancel"] },
  { contains = ["esc interrupt"] }
]
