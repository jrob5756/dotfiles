# Compatibility configuration for pre-migration ~/.tmux.conf symlinks.
unbind C-b
set -g prefix C-a
bind C-a send-prefix
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"
set -g status-position top
set -g renumber-windows on
set -g detach-on-destroy off
set -sa terminal-overrides ",xterm*:Tc,tmux-256color:Tc,screen*:Tc"
set -ga update-environment " COLORTERM"
set -g window-style 'fg=#7f849c,bg=terminal'
set -g window-active-style 'fg=terminal,bg=terminal'
set -g pane-border-lines heavy
set -g pane-border-indicators arrows
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#89b4fa,bold'
set -g status-style 'bg=default,fg=#cdd6f4'
set -g status-left-length 40
set -g status-left '#[fg=#1e1e2e,bold]#{?client_prefix,#[bg=#f38ba8],#[bg=#89b4fa]} #S #[default] '
set -g status-right-length 60
set -g status-right '#[fg=#f9e2af]#{?window_zoomed_flag,ZOOM ,}#[fg=#7f849c]%a %H:%M #[fg=#1e1e2e,bg=#b4befe,bold] #h '
setw -g window-status-separator ''
setw -g window-status-format '#[fg=#7f849c] #I:#W '
setw -g window-status-current-format '#[fg=#1e1e2e,bg=#cba6f7,bold] #I:#W '
setw -g window-status-activity-style 'fg=#f9e2af'
set -g message-style 'bg=#313244,fg=#cdd6f4'
set -g message-command-style 'bg=#313244,fg=#cdd6f4'
setw -g mode-style 'bg=#45475a,fg=#cdd6f4'
set -g popup-border-style 'fg=#89b4fa'
set -g popup-border-lines rounded
set -g xterm-keys on
set -s extended-keys always
set -s extended-keys-format csi-u
set -s terminal-features[100] 'xterm-ghostty:extkeys'
bind-key -n S-Enter send-keys Escape Enter

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -b -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind - split-window -b -v -c "#{pane_current_path}"
bind x kill-pane
bind & confirm-before -p "kill-window #W? (y/n)" kill-window

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
set -g set-clipboard on
set -g allow-passthrough on
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
run '~/.tmux/plugins/tpm/tpm'
