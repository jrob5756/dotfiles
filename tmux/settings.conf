set -g status-position top
set -g renumber-windows on
# Closing a session's last window switches to another session instead of exiting tmux.
set -g detach-on-destroy off
set -sa terminal-overrides ",xterm*:Tc,tmux-256color:Tc,screen*:Tc"
set -ga update-environment " COLORTERM"
# Pass OSC 8 hyperlinks through to the outer terminal so links stay clickable.
set -as terminal-features ",xterm*:hyperlinks"

set -g xterm-keys on
set -s extended-keys always
set -s extended-keys-format csi-u
set -s terminal-features[100] 'xterm-ghostty:extkeys'
bind-key -n S-Enter send-keys Escape Enter

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -b -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind - split-window -b -v -c "#{pane_current_path}"
bind x kill-pane
bind & confirm-before -p "kill-window #W? (y/n)" kill-window

# vim-tmux-navigator owns C-h/j/k/l; prefix C-l keeps the shell's clear-screen.
bind C-l send-keys C-l

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Forward application clipboard writes and terminal passthrough.
set -g set-clipboard on
set -g allow-passthrough on
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"
