set -g status-position top
set -g renumber-windows on
set -sa terminal-overrides ",xterm*:Tc,tmux-256color:Tc,screen*:Tc"
set -ga update-environment " COLORTERM"

# Preserve the outer terminal's background and transparency; dim only inactive panes' default text.
set -g window-style 'fg=#7f849c,bg=terminal'
set -g window-active-style 'fg=terminal,bg=terminal'

# Make the active pane obvious (Catppuccin Mocha colours to match Ghostty).
set -g pane-border-lines heavy
set -g pane-border-indicators arrows
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#89b4fa,bold'
set -g xterm-keys on
set -s extended-keys always
set -s extended-keys-format csi-u
set -s terminal-features[100] 'xterm-ghostty:extkeys'
bind-key -n S-Enter send-keys Escape Enter

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -b -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind - split-window -b -v -c "#{pane_current_path}"
bind x kill-pane
bind & confirm-before -p "kill-window #W? (y/n)" kill-window

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Forward application clipboard writes and terminal passthrough.
set -g set-clipboard on
set -g allow-passthrough on
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"
